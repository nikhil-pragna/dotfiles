set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0

set-option -g renumber-windows on
set -g mouse on

# unbind C-b
set-option -g prefix C-b
bind-key C-b send-prefix

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'pbcopy'

# smooth mouse-wheel scrolling: 1 line per tick (default is 5)
# bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
# bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Kill the current pane without a confirmation prompt
unbind-key x
bind-key x kill-pane

# Kill the current session without a confirmation prompt
unbind-key X
bind-key X kill-session

bind -r K resize-pane -U
bind -r J resize-pane -D
bind -r H resize-pane -L
bind -r L resize-pane -R


# quazi setup
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Theme Config

# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha'

set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @theme_variation 'storm'
set -g @theme_disable_plugins 1
set -g @powerkit_separator_style 'slantup'
set -g @powerkit_edge_separator_style 'slantup'
set -g @powerkit_initial_separator_style 'slantup'

set-option -g status-position bottom
set -g @powerkit_status_position 'bottom'
set -g @powerkit_plugins 'git'
set -g status-justify left

# Pane borders — brighter so splits are easy to see
set -g pane-border-style 'fg=#7aa2f7'
set -g pane-active-border-style 'fg=#ff9e64,bold'
set -g pane-border-lines heavy

# set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key F copy-mode \; send-keys -X search-backward \
  '(^|/|\<|[[:space:]"])((\.|\.\.)|[[:alnum:]~_"-]*)((/[][[:alnum:]_.#$%&+=@"-]+)+([/ "]|\.([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)(:[0-9]+)?)|(/[][[:alnum:]_.#$%&+=@"-]+){2,}([/ "]|\.([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)(:[0-9]+)?)?|(\.|\.\.)/([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?))'


# o: open selected path in Finder or the default macOS app (macOS 'open'); updated for escaping
bind-key -T copy-mode-vi o send-keys -X copy-pipe "~/scripts/tmux-open.sh"

# O: open selection in neovim (uses helper script)
bind-key -T copy-mode-vi O send-keys -X copy-pipe-and-cancel "~/scripts/open-in-nvim.sh"

bind G neww -n "lazygit" lazygit
bind D neww -n "lazydocker" lazydocker

bind f run-shell "tmux neww ~/scripts/tmux-session-dispensary.sh"
bind t run-shell "tmux neww ~/scripts/time.sh"


# Force status bar to stay at bottom after plugins load
set-option -g status-position bottom

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
